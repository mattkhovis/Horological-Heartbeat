name: Build and Release macOS App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    env:
      APP_NAME: Horological Heartbeat
      SCHEME: HorologicalHeartbeat
      PROJECT_PATH: HorologicalHeartbeat.xcodeproj
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build archive
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package app
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          APP_PATH="$RUNNER_TEMP/$SCHEME.xcarchive/Products/Applications/$APP_NAME.app"

          if [[ ! -d "$APP_PATH" ]]; then
            echo "App not found at $APP_PATH"
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/$APP_NAME.zip"

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Horological Heartbeat.zip
          generate_release_notes: true
